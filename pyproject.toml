[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rebot-tea"
version = "0.1.0"
description = "B601-RS visual grasping scaffold"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rebot-tea = "rebot_tea.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
